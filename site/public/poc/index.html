document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"fd3c1866-b89f-4178-831e-8c26bbc87b67\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n\n<style>\n@font-face { font-family:\"Zalando Sans Expanded\"; src:url(\"407ea07a-1125-4509-ba07-de701aec796a\") format(\"truetype-variations\"); font-weight:300 900; font-style:normal; font-display:swap; }\n@font-face { font-family:\"Zalando Sans\"; src:url(\"95288904-461c-45cd-b3bc-1edd29b66651\") format(\"truetype-variations\"); font-weight:300 900; font-style:normal; font-display:swap; }\n* { box-sizing:border-box; }\nsvg { flex:none; }\nhtml,body { margin:0; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh; background:#0D132C; padding:44px 32px 72px; font-family:'Zalando Sans',sans-serif;\">\n  <div style=\"max-width:1260px; margin:0 auto;\">\n\n    <!-- header -->\n    <div style=\"display:flex; justify-content:space-between; align-items:flex-start; gap:24px; flex-wrap:wrap;\">\n      <div style=\"max-width:780px;\">\n        <div style=\"display:flex; align-items:center; gap:14px; margin-bottom:22px;\">\n          <img src=\"84b78964-b1bc-4e12-9c41-292da3a4e98f\" alt=\"Infracost\" style=\"height:24px;\">\n          <span style=\"font-family:'Zalando Sans',sans-serif; font-weight:500; font-size:12px; letter-spacing:3px; text-transform:uppercase; color:#A6ADC8; border-left:1px solid rgba(166,173,200,0.30); padding-left:14px;\">Cruise · POC scoping<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"height:2px; width:48px; background:#F72585; margin:0 0 16px;\"><\u002Fdiv>\n        <div style=\"font-family:'Zalando Sans Expanded',sans-serif; font-weight:600; font-size:34px; line-height:1.12; color:#EAE9F2;\">Scope the POC across the <span style=\"color:#F72585;\">lifecycle<\u002Fspan>.<\u002Fdiv>\n        <div style=\"font-size:15px; color:#A6ADC8; margin-top:12px; line-height:1.5;\">Set each pillar's status to cycle it through undecided → in scope → out of scope. The summary below tracks key functionality and what's required to activate it.<\u002Fdiv>\n      <\u002Fdiv>\n      <button onclick=\"{{ onReset }}\" style=\"display:inline-flex; align-items:center; gap:8px; background:transparent; color:#A6ADC8; font-family:'Zalando Sans',sans-serif; font-weight:500; font-size:13px; letter-spacing:0.5px; border:1px solid rgba(166,173,200,0.30); border-radius:8px; padding:9px 14px; cursor:pointer; transition:all 120ms cubic-bezier(0.2,0.8,0.2,1);\" style-hover=\"color:#22D3EE; border-color:rgba(34,211,238,0.5);\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8\"><\u002Fpath><path d=\"M3 3v5h5\"><\u002Fpath><\u002Fsvg>Reset<\u002Fbutton>\n    <\u002Fdiv>\n\n    <!-- lifecycle track -->\n    <div style=\"display:flex; align-items:center; gap:10px; margin:34px 0 16px; font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:1px; color:#747CA2; text-transform:uppercase;\">\n      <span>Build<\u002Fspan><span style=\"flex:1; height:1px; background:rgba(166,173,200,0.18);\"><\u002Fspan><span>Review<\u002Fspan><span style=\"flex:1; height:1px; background:rgba(166,173,200,0.18);\"><\u002Fspan><span>Remediate<\u002Fspan>\n    <\u002Fdiv>\n\n    <!-- pillars -->\n    <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:18px; align-items:stretch;\">\n      <sc-for list=\"{{ pillars }}\" as=\"p\" hint-placeholder-count=\"3\">\n        <div style=\"{{ p.cardStyle }}\">\n          <div onclick=\"{{ p.onCycle }}\" style=\"{{ p.statusBar }}\">\n            {{ p.badgeIconEl }}\n            <span>{{ p.badgeLabel }}<\u002Fspan>\n            <span style=\"margin-left:auto; display:inline-flex; align-items:center; gap:5px; font-family:'IBM Plex Mono',monospace; font-weight:400; font-size:11px; letter-spacing:0.5px; opacity:0.7; text-transform:none;\"><svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8\"><\u002Fpath><path d=\"M3 3v5h5\"><\u002Fpath><path d=\"M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16\"><\u002Fpath><path d=\"M21 21v-5h-5\"><\u002Fpath><\u002Fsvg>cycle<\u002Fspan>\n          <\u002Fdiv>\n\n          <div style=\"display:flex; align-items:center; gap:12px; margin-top:18px;\">\n            <div style=\"{{ p.iconChip }}\">{{ p.iconEl }}<\u002Fdiv>\n            <div>\n              <div style=\"font-family:'Zalando Sans Expanded',sans-serif; font-weight:600; font-size:19px; color:#EAE9F2; line-height:1.1;\">{{ p.name }}<\u002Fdiv>\n              <div style=\"font-size:12px; letter-spacing:1.5px; text-transform:uppercase; color:#747CA2; margin-top:3px;\">{{ p.who }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; color:#A6ADC8; margin-top:14px;\">{{ p.tagline }}<\u002Fdiv>\n\n          <div style=\"font-family:'Zalando Sans',sans-serif; font-weight:500; font-size:11px; letter-spacing:2.5px; text-transform:uppercase; color:#10D9A0; margin:22px 0 11px;\">Key functionality<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:9px;\">\n            <sc-for list=\"{{ p.get }}\" as=\"g\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex; align-items:flex-start; gap:9px; font-size:14px; color:#EAE9F2; line-height:1.35;\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#10D9A0\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"margin-top:1px;\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><path d=\"m9 12 2 2 4-4\"><\u002Fpath><\u002Fsvg><span>{{ g }}<\u002Fspan><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"height:1px; background:rgba(166,173,200,0.18); margin:18px 0;\"><\u002Fdiv>\n\n          <div style=\"font-family:'Zalando Sans',sans-serif; font-weight:500; font-size:11px; letter-spacing:2.5px; text-transform:uppercase; color:#FFBA08; margin:0 0 11px;\">Required to activate<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:9px;\">\n            <sc-for list=\"{{ p.enable }}\" as=\"e\" hint-placeholder-count=\"2\">\n              <div style=\"display:flex; align-items:flex-start; gap:9px; font-size:14px; color:#A6ADC8; line-height:1.35;\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#FFBA08\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"margin-top:1px;\"><circle cx=\"7.5\" cy=\"15.5\" r=\"5.5\"><\u002Fcircle><path d=\"m21 2-9.6 9.6\"><\u002Fpath><path d=\"m15.5 7.5 3 3L22 7l-3-3\"><\u002Fpath><\u002Fsvg><span>{{ e }}<\u002Fspan><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <!-- payoff -->\n    <div style=\"margin-top:30px; border-top:2px solid #F72585; padding-top:26px;\">\n      <div style=\"display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:8px;\">\n        <div style=\"font-family:'Zalando Sans Expanded',sans-serif; font-weight:600; font-size:22px; color:#EAE9F2;\">POC scope summary<\u002Fdiv>\n        <div style=\"font-family:'IBM Plex Mono',monospace; font-size:13px; color:#A6ADC8;\">{{ scopeCount }}<\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ hasScope }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:20px;\">\n          <div style=\"background:#131D34; border:1px solid rgba(16,217,160,0.30); border-radius:14px; padding:24px;\">\n            <div style=\"font-family:'Zalando Sans',sans-serif; font-weight:500; font-size:11px; letter-spacing:2.5px; text-transform:uppercase; color:#10D9A0; margin-bottom:16px;\">Key functionality in scope<\u002Fdiv>\n            <div style=\"display:flex; flex-direction:column; gap:11px;\">\n              <sc-for list=\"{{ scopeGet }}\" as=\"it\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex; align-items:flex-start; gap:10px; font-size:14px; color:#EAE9F2;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#10D9A0\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"margin-top:2px;\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg><span>{{ it.text }} <span style=\"color:#747CA2; font-size:12px;\">· {{ it.from }}<\u002Fspan><\u002Fspan><\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#131D34; border:1px solid rgba(255,186,8,0.30); border-radius:14px; padding:24px;\">\n            <div style=\"font-family:'Zalando Sans',sans-serif; font-weight:500; font-size:11px; letter-spacing:2.5px; text-transform:uppercase; color:#FFBA08; margin-bottom:16px;\">Required to activate<\u002Fdiv>\n            <div style=\"display:flex; flex-direction:column; gap:11px;\">\n              <sc-for list=\"{{ scopeEnable }}\" as=\"it\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex; align-items:flex-start; gap:10px; font-size:14px; color:#EAE9F2;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#FFBA08\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"margin-top:2px;\"><circle cx=\"7.5\" cy=\"15.5\" r=\"5.5\"><\u002Fcircle><path d=\"m21 2-9.6 9.6\"><\u002Fpath><path d=\"m15.5 7.5 3 3L22 7l-3-3\"><\u002Fpath><\u002Fsvg><span>{{ it.text }} <span style=\"color:#747CA2; font-size:12px;\">· {{ it.from }}<\u002Fspan><\u002Fspan><\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ noScope }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-top:18px; padding:30px; text-align:center; border:1px dashed rgba(166,173,200,0.30); border-radius:14px; color:#747CA2; font-size:14px;\">No pillars in scope yet — set a pillar's status to \"in scope\" above to build the POC plan.<\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { dev:'neutral', check:'neutral', fix:'neutral' };\n\n  componentDidMount() {\n    try {\n      const saved = JSON.parse(localStorage.getItem('cruise-poc-scope') || 'null');\n      if (saved && saved.dev) this.setState(saved);\n    } catch (e) {}\n  }\n\n  persist(next) {\n    try { localStorage.setItem('cruise-poc-scope', JSON.stringify(next)); } catch (e) {}\n  }\n\n  get ICONS() {\n    return {\n      'code': '<path d=\"m16 18 6-6-6-6\"><\u002Fpath><path d=\"m8 6-6 6 6 6\"><\u002Fpath>',\n      'git-pull-request': '<circle cx=\"6\" cy=\"6\" r=\"3\"><\u002Fcircle><circle cx=\"6\" cy=\"18\" r=\"3\"><\u002Fcircle><line x1=\"6\" y1=\"9\" x2=\"6\" y2=\"15\"><\u002Fline><path d=\"M13 6h3a2 2 0 0 1 2 2v7\"><\u002Fpath><circle cx=\"18\" cy=\"18\" r=\"3\"><\u002Fcircle>',\n      'wrench': '<path d=\"M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z\"><\u002Fpath>',\n      'check-circle': '<circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><path d=\"m9 12 2 2 4-4\"><\u002Fpath>',\n      'x-circle': '<circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><path d=\"m15 9-6 6\"><\u002Fpath><path d=\"m9 9 6 6\"><\u002Fpath>',\n      'circle-dashed': '<circle cx=\"12\" cy=\"12\" r=\"10\" stroke-dasharray=\"2.5 3.5\"><\u002Fcircle>',\n    };\n  }\n\n  icon(name, size) {\n    return React.createElement('svg', {\n      width: size, height: size, viewBox: '0 0 24 24', fill: 'none',\n      stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round',\n      dangerouslySetInnerHTML: { __html: this.ICONS[name] || '' },\n    });\n  }\n\n  tint(hex, a) {\n    const n = parseInt(hex.slice(1), 16);\n    return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;\n  }\n\n  cycle(id) {\n    const order = { neutral:'in', in:'out', out:'neutral' };\n    this.setState(s => {\n      const next = { ...s, [id]: order[s[id]] };\n      this.persist(next);\n      return next;\n    });\n  }\n\n  reset() {\n    const next = { dev:'neutral', check:'neutral', fix:'neutral' };\n    this.persist(next);\n    this.setState(next);\n  }\n\n  get defs() {\n    return [\n      { id:'dev', name:'Infracost Dev', who:'For engineers', accent:'#4F46E5',\n        tagline:'Installed on developer machines', icon:'code',\n        get:['Local CLI','IDE extensions','Agent skills','Claude / OpenAI / Copilot integrations'],\n        enable:['Direct engineer engagement','Live working session during the POC'] },\n      { id:'check', name:'Infracost Check', who:'For platform teams', accent:'#7C3AED',\n        tagline:'Runs in your VCS & CI/CD', icon:'git-pull-request',\n        get:['Automatic repo & PR scans','Issue identification','Savings opportunities','Guardrails'],\n        enable:['VCS integration & access','Module / artifact / registry access','Posting PR comments on IaC repos'] },\n      { id:'fix', name:'Infracost Fix', who:'For FinOps teams', accent:'#10D9A0',\n        tagline:'Agents across your cloud estate', icon:'wrench',\n        get:['Agents that find live issues','Continuous detection','Human-in-the-loop remediation'],\n        enable:['Approval to use AI','AWS cross-account access'] },\n    ];\n  }\n\n  badge(state, accent) {\n    if (state === 'in') return { label:'In scope', icon:'check-circle' };\n    if (state === 'out') return { label:'Out of scope', icon:'x-circle' };\n    return { label:'Undecided', icon:'circle-dashed' };\n  }\n\n  statusBar(state, accent) {\n    const base = 'display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none;border-radius:10px;padding:12px 14px;font-family:\\'Zalando Sans\\',sans-serif;font-weight:600;font-size:13.5px;letter-spacing:0.5px;text-transform:uppercase;transition:all 220ms cubic-bezier(0.2,0.8,0.2,1);';\n    if (state === 'in') return base + `color:${accent};background:${this.tint(accent,0.16)};border:1px solid ${this.tint(accent,0.5)};`;\n    if (state === 'out') return base + 'color:#A6ADC8;background:rgba(166,173,200,0.10);border:1px solid rgba(166,173,200,0.22);';\n    return base + 'color:#A6ADC8;background:#0E1526;border:1px solid rgba(166,173,200,0.22);';\n  }\n\n  iconChip(accent, state) {\n    const on = state === 'in';\n    return `display:flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:11px;flex:none;color:${on?'#fff':accent};background:${on?accent:this.tint(accent,0.14)};border:1px solid ${this.tint(accent,0.4)};transition:all 220ms cubic-bezier(0.2,0.8,0.2,1);`;\n  }\n\n  cardStyle(state, accent) {\n    let s = 'border-radius:16px;padding:22px;transition:all 220ms cubic-bezier(0.2,0.8,0.2,1);display:flex;flex-direction:column;';\n    if (state === 'in') s += `background:${this.tint(accent,0.07)};border:1px solid ${this.tint(accent,0.55)};box-shadow:0 0 0 1px ${this.tint(accent,0.25)}, 0 0 30px ${this.tint(accent,0.20)};`;\n    else if (state === 'out') s += 'background:#161F3C;border:1px solid rgba(166,173,200,0.14);opacity:0.55;';\n    else s += 'background:#1A2340;border:1px solid rgba(166,173,200,0.20);';\n    return s;\n  }\n\n  renderVals() {\n    const pillars = this.defs.map(p => {\n      const state = this.state[p.id];\n      const b = this.badge(state, p.accent);\n      return { ...p, state,\n        onCycle: () => this.cycle(p.id),\n        badgeLabel:b.label, badgeIconEl:this.icon(b.icon, 17), iconEl:this.icon(p.icon, 22),\n        statusBar:this.statusBar(state, p.accent),\n        iconChip:this.iconChip(p.accent, state),\n        cardStyle:this.cardStyle(state, p.accent),\n      };\n    });\n\n    const inScope = this.defs.filter(p => this.state[p.id] === 'in');\n    const scopeGet = [], scopeEnable = [];\n    inScope.forEach(p => {\n      const tag = p.name.replace('Infracost ','');\n      p.get.forEach(t => scopeGet.push({ text:t, from:tag }));\n      p.enable.forEach(t => scopeEnable.push({ text:t, from:tag }));\n    });\n    const hasScope = inScope.length > 0;\n\n    return {\n      pillars,\n      onReset: () => this.reset(),\n      scopeGet, scopeEnable, hasScope, noScope: !hasScope,\n      scopeCount: `${inScope.length} of 3 pillars in scope`,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
